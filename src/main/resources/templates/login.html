<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login</title>
</head>

<body>

<h2>🥋 Wushu Training Manager</h2>

<h3>Sign In</h3>

<div th:if="${param.error}"
     style="color:red;">

    Invalid username or password.

</div>

<div th:if="${param.logout}"
     style="color:green;">

    You have been logged out.

</div>

<form th:action="@{/login}"
      method="post">

    <p>

        Username

        <br>

        <input type="text"
               name="username"
               required>

    </p>

    <p>

        Password

        <br>

        <input type="password"
               name="password"
               required>

    </p>

    <button type="submit">

        Login

    </button>

</form>

</body>
</html>
