<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: menu}"></div>

<h1>Students</h1>

<div th:if="${error}"
     style="color:red; font-weight:bold; margin-bottom:15px;">

    <span th:text="${error}"></span>

</div>

<a th:href="@{/students/new}">
    Create Student
</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Phone</th>
        <th>Actions</th>
    </tr>

    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.age}"></td>
        <td th:text="${student.phone}"></td>

        <td>

            <a th:href="@{/students/edit/{id}(id=${student.id})}">
                Edit
            </a>

            <form th:action="@{/students/delete/{id}(id=${student.id})}"
                  method="post"
                  style="display:inline">

                <button type="submit">
                    Delete
                </button>

            </form>

        </td>
    </tr>

</table>

<br><br>

<div>

    <a th:if="${currentPage > 0}"
       th:href="@{/students(page=${currentPage - 1})}">
        ← Previous
    </a>

    &nbsp;&nbsp;

    <span>
        Page <span th:text="${currentPage + 1}"></span>
        of
        <span th:text="${totalPages}"></span>
    </span>

    &nbsp;&nbsp;

    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/students(page=${currentPage + 1})}">
        Next →
    </a>

</div>

</body>
</html>
