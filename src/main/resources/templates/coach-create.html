<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Coach</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: menu}"></div>

<h2>Create Coach</h2>

<form th:action="@{/coaches}"
      th:object="${coach}"
      method="post">

    <label>Name:</label><br>

    <input type="text"
           th:field="*{name}">

    <div
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            style="color:red;font-size:13px">
    </div>

    <br>

    <label>Experience:</label><br>

    <input type="number"
           th:field="*{experienceYears}">

    <div
            th:if="${#fields.hasErrors('experienceYears')}"
            th:errors="*{experienceYears}"
            style="color:red;font-size:13px">
    </div>

    <br>

    <label>Phone:</label><br>

    <input type="text"
           th:field="*{phone}">

    <div
            th:if="${#fields.hasErrors('phone')}"
            th:errors="*{phone}"
            style="color:red;font-size:13px">
    </div>

    <br>

    <button type="submit">
        Create
    </button>

</form>

<br>

<a th:href="@{/coaches}">
    Back
</a>

</body>
</html>
